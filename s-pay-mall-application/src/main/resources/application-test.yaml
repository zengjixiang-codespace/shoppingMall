# ============================================================
# 测试环境配置（test）
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://test-db-host:3306/s_pay_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

server:
  port: 8080

logging:
  level:
    root: INFO
    com.codespace: INFO
