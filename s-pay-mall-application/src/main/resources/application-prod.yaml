# ============================================================
# 生产环境配置（prod）
# ============================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/s_pay_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.codespace: INFO
