# ============================================================
# 开发环境配置（dev）-- 可安全提交到 Git
# ${datasource.*} 占位符由 application-local.yaml 提供真实值
# ============================================================
spring:
  datasource:
    url: ${datasource.url}
    username: ${datasource.username}
    password: ${datasource.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

server:
  port: 9090

logging:
  level:
    root: INFO
    com.codespace: DEBUG
